name: Check Mail Bot

on:
  schedule:
    # بيشتغل أوتوماتيك الساعة 12 الضهر بتوقيت القاهرة (10 الصبح UTC)
    - cron: '0 10 * * *' 
  workflow_dispatch: # ده الزرار اللي أنت هتدوس عليه يدوي

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
